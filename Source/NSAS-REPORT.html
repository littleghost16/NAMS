g:1px 4px}}</style><header><div style=display:flex;align-items:center;gap:12px><img src=clip.png alt=1Icon style=height:40px><div><h1>NJROTC Supply Report</h1></div></div></header><div class=control-panel><div><div class=file-input-wrapper><label for=jsonFileInput class=custom-file-label>Upload NSAS JSON</label><input type=file id=jsonFileInput accept=.json><span id=fileNameDisplay style=color:var(--muted)>No file chosen</span></div><button id=printBtn class=print-btn onclick=window.print()>Print / Save as PDF</button></div><div class="description-box panel"><span>How to use:</span><br>This tool is specifically designed for converting<span>NSAS JSON Data files</span>into printable PDF formats. Upload your exported JSON file to generate a professional inventory or issue profile report.</div></div><div id=report-container></div><script>const fileInput=document.getElementById("jsonFileInput"),reportContainer=document.getElementById("report-container"),printBtn=document.getElementById("printBtn"),fileNameDisplay=document.getElementById("fileNameDisplay");function generateReport(t){reportContainer.innerHTML="",Array.isArray(t)?t.forEach((t=>{const e=document.createElement("div");e.className="profile-card";const n=`\n                    <div class="profile-header">\n                        <h2>${t.name||"Unknown Name"}</h2>\n                        <span>ID: ${t.schoolId||"N/A"}</span>\n                    </div>\n                    <div class="profile-meta">\n                        <div class="meta-item"><span class="meta-label">Gender:</span> ${t.gender||"-"}</div>\n                        <div class="meta-item"><span class="meta-label">Date:</span> ${t.date||"-"}</div>\n                        <div class="meta-item"><span class="meta-label">Perm Form:</span> ${t.permissionForm||"-"}</div>\n                    </div>\n                `;let s='\n                    <table class="items-table">\n                        <thead>\n                            <tr>\n                                <th style="width: 25%;">Item Name</th>\n                                <th style="width: 5%;">Qty</th>\n                                <th style="width: 10%;">Size</th>\n                                <th style="width: 10%;">Issue Date</th>\n                                <th style="width: 10%;">Item ID</th>\n                                <th style="width: 10%;">Return Date</th>\n                                <th style="width: 10%;">Price</th>\n                                <th style="width: 10%;">Status</th>\n                            </tr>\n                        </thead>\n                        <tbody>\n                ';t.items&&t.items.length>0?t.items.forEach((t=>{const e=(t.status||"").toLowerCase();let n="";e.includes("use")?n="status-in-use":e.includes("missing")?n="status-missing":e.includes("returned")&&(n="status-returned"),s+=`\n                            <tr>\n                                <td>${t.name||"-"}</td>\n                                <td style="text-align:center;">${t.qty||"-"}</td>\n                                <td>${t.size||"-"}</td>\n                                <td>${t.issueDate||"-"}</td>\n                                <td>${t.itemId||"-"}</td>\n                                <td>${t.returnDate||"-"}</td>\n                                <td>${t.price?"$"+t.price:"-"}</td>\n                                <td><span class="status-badge ${n}">${t.status||"-"}</span></td>\n                            </tr>\n                        `})):s+='<tr><td colspan="8" style="text-align:center; padding: 10px;">No items issued.</td></tr>',s+="</tbody></table>",e.innerHTML=n+s,reportContainer.appendChild(e)})):reportContainer.innerHTML='<p style="text-align:center; color:red;">Invalid JSON format. Expected an array of profiles.</p>'}fileInput.addEventListener("change",(function(t){const e=t.target.files[0];if(!e)return;fileNameDisplay.textContent=e.name;const n=new FileReader;n.onload=function(t){try{g
